services:
  - type: web
    name: booking-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /health
    disk:
      name: booking-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /opt/render/project/src/instance/bookings.sqlite3
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_URL_TOKEN
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: APP_BASE_URL
        sync: false
