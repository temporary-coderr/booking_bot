name: Netlify project checks

on:
  push:
    branches: [main, cloudflare-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Netlify function syntax
        run: |
          node --check netlify/functions/api.mjs
          node --check netlify/functions/scheduled-match.mjs
      - name: Check frontend JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/admin.js

      - name: Check Cloudflare Worker syntax
        run: node --check worker/index.js
      - name: Validate D1 migration SQL
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("migrations/0001_initial.sql").read_text())
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {"bookings", "driver_availability", "receivers", "help_contacts", "notifications", "activity", "settings"}
          missing = required - tables
          if missing:
              raise SystemExit(f"Missing D1 tables: {sorted(missing)}")
          print("D1 migration valid; all required tables exist.")
          PY
      - name: Test D1 booking rules and retention
        run: python3 -m unittest tests/test_cloudflare_d1.py
