name: Netlify project checks

on:
  push:
    branches: [main, cloudflare-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Netlify function syntax
        run: |
          node --check netlify/functions/api.mjs
          node --check netlify/functions/scheduled-match.mjs
      - name: Check frontend JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/admin.js
