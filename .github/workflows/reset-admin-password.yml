name: Reset admin password

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-password:
    runs-on: ubuntu-latest
    steps:
      - name: Validate reset configuration
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          test -n "$ADMIN_PASSWORD" || (echo "ADMIN_PASSWORD secret is missing" && exit 1)
          test -n "$RENDER_API_KEY" || (echo "RENDER_API_KEY secret is missing" && exit 1)
          test -n "$RENDER_SERVICE_ID" || (echo "RENDER_SERVICE_ID secret is missing" && exit 1)
      - name: Update Render password and restart service
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          python - <<'PY'
          import json, os
          with open("admin-password.json", "w", encoding="utf-8") as f:
              json.dump({"value": os.environ["ADMIN_PASSWORD"]}, f)
          PY
          curl --fail --silent --show-error --request PUT \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/ADMIN_PASSWORD" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data-binary @admin-password.json
          rm -f admin-password.json
          curl --fail --silent --show-error --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{}'
